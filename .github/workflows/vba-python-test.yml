name: Test Python VBA Automation Adapters
on:
  pull_request:
    paths:
      - 'worker/carriers.py'
      - 'worker/tracking_agent.py'
      - 'worker/datadoc_email_agent.py'
      - 'worker/outlook_mailbox_bridge.py'
      - 'worker/outlook_reply_agent.py'
      - 'worker/test_*agent.py'
      - 'worker/test_outlook_mailbox_bridge.py'
      - 'worker/oms_dispatch_bridge.py'
      - 'worker/test_oms_dispatch_bridge.py'
      - 'worker/outlook_draft_worker.py'
      - 'worker/test_outlook_draft_worker.py'
      - '.github/workflows/vba-python-test.yml'
  push:
    branches: [main]
    paths:
      - 'worker/carriers.py'
      - 'worker/tracking_agent.py'
      - 'worker/datadoc_email_agent.py'
      - 'worker/outlook_mailbox_bridge.py'
      - 'worker/outlook_reply_agent.py'
      - 'worker/test_*agent.py'
      - 'worker/test_outlook_mailbox_bridge.py'
      - '.github/workflows/vba-python-test.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium (no network / Outlook connections during test)
        run: python -m pip install 'selenium>=4.35,<5'
      - name: Syntax-check all new adapters
        working-directory: worker
        run: python -m py_compile carriers.py tracking_agent.py datadoc_email_agent.py outlook_reply_agent.py outlook_mailbox_bridge.py oms_dispatch_bridge.py outlook_draft_worker.py
      - name: Test carrier status, batch control, DataDoc proof and Reply All mailbox matching
        working-directory: worker
        run: python -m unittest -v test_tracking_agent.py test_datadoc_email_agent.py test_outlook_reply_agent.py test_outlook_mailbox_bridge.py test_oms_dispatch_bridge.py test_outlook_draft_worker.py
